<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EstateOps — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0f172a;
        padding: 1.5rem;
        text-align: center;
      }
      .card { max-width: 20rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.75rem; }
      p { color: #64748b; font-size: 0.9375rem; line-height: 1.5; }
      button {
        margin-top: 1.25rem;
        padding: 0.625rem 1.25rem;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Please reconnect to continue using EstateOps.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
