apiVersion: apps/v1
kind: Deployment
metadata:
  name: estateops-api
  namespace: estateops
  labels:
    app.kubernetes.io/name: estateops
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estateops
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: estateops/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: estateops-config
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: estateops-config
                  key: API_PORT
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: estateops-secrets
                  key: DATABASE_PASSWORD
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
